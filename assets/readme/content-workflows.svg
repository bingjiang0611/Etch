<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Etch 的三条内容工作流与统一恢复边界</title>
  <desc id="desc">视频可以生成双语硬字幕或带外部证据的中文长文；网页和单条 X 内容可以生成 Markdown 与离线 HTML。所有阶段经 task.json checkpoint 验证后提交。</desc>

  <rect width="1200" height="560" rx="24" fill="#0B0D10"/>
  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#252B33" stroke-width="2"/>

