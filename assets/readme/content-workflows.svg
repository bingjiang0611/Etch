    <text x="0" y="36" fill="#88919D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">每一步先形成候选产物，经过校验后才写回 task.json。</text>
  </g>

