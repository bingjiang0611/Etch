<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Etch — ローカル英中バイリンガル字幕ワークステーション</title>
  <desc id="desc">Etch は動画 URL を取得し、文字起こし、翻訳、用語監査、人手校正、焼き込みを経て、検証可能な英中バイリンガル字幕付き動画に仕上げます。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161d"/>
      <stop offset="0.58" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#438cf5"/>
      <stop offset="1" stop-color="#7fb2ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="29" fill="none" stroke="#2b333d" stroke-width="2"/>

  <g transform="translate(62 54)">
    <text x="0" y="0" fill="#7fb2ff"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="650" letter-spacing="2">LOCAL BILINGUAL SUBTITLE WORKSTATION</text>
    <text x="0" y="84" fill="#f2f4f7"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif"
          font-size="82" font-weight="720" letter-spacing="-3">Etch</text>
    <text x="0" y="132" fill="#c5cad1"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif"
          font-size="27" font-weight="520">英語動画を、校正可能な英中バイリンガル字幕付き動画へ</text>
    <text x="0" y="177" fill="#7f8996"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18">APPLE SILICON  ·  macOS 13.5+  ·  v0.1.1</text>
  </g>

  <g transform="translate(1002 58)">
    <rect x="0" y="0" width="126" height="126" rx="30" fill="#101721" stroke="#344154" stroke-width="2"/>
    <rect x="31" y="30" width="19" height="67" rx="9.5" fill="url(#accent)"/>
    <rect x="31" y="30" width="66" height="19" rx="9.5" fill="#e8f0ff"/>
    <rect x="31" y="54" width="47" height="19" rx="9.5" fill="#6ba6ff"/>
    <rect x="31" y="78" width="66" height="19" rx="9.5" fill="#315f9f"/>
  </g>

  <g transform="translate(62 286)">
    <path d="M24 31 H1046" fill="none" stroke="#2b333d" stroke-width="4"/>
    <path d="M24 31 H832" fill="none" stroke="url(#accent)" stroke-width="4"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif" font-size="16" text-anchor="middle">
      <g transform="translate(24 0)">
        <circle cx="0" cy="31" r="14" fill="#101c16" stroke="#6cc79a" stroke-width="3"/>
        <path d="M-6 31 l4 4 l8 -9" fill="none" stroke="#6cc79a" stroke-width="2.5" stroke-linecap="round"/>
        <text x="0" y="78" fill="#aab2bd">取得</text>
      </g>
      <g transform="translate(226 0)">
        <circle cx="0" cy="31" r="14" fill="#101c16" stroke="#6cc79a" stroke-width="3"/>
        <path d="M-6 31 l4 4 l8 -9" fill="none" stroke="#6cc79a" stroke-width="2.5" stroke-linecap="round"/>
        <text x="0" y="78" fill="#aab2bd">文字起こし</text>
      </g>
      <g transform="translate(428 0)">
        <circle cx="0" cy="31" r="14" fill="#0f1b2a" stroke="#7fb2ff" stroke-width="3"/>
        <text x="0" y="37" fill="#9fc4ff" font-size="17" font-weight="700">訳</text>
        <text x="0" y="78" fill="#d2e2f8">翻訳</text>
      </g>
      <g transform="translate(630 0)">
        <circle cx="0" cy="31" r="14" fill="#19150f" stroke="#e0b872" stroke-width="3"/>
        <text x="0" y="37" fill="#e0b872" font-size="17" font-weight="700">監</text>
        <text x="0" y="78" fill="#d9c49d">用語監査</text>
      </g>
      <g transform="translate(832 0)">
        <circle cx="0" cy="31" r="14" fill="#0f1b2a" stroke="#7fb2ff" stroke-width="3"/>
        <text x="0" y="37" fill="#9fc4ff" font-size="17" font-weight="700">校</text>
        <text x="0" y="78" fill="#d2e2f8">人手校正</text>
      </g>
      <g transform="translate(1034 0)">
        <circle cx="0" cy="31" r="14" fill="#11151a" stroke="#69727e" stroke-width="3"/>
        <text x="0" y="37" fill="#88919d" font-size="17" font-weight="700">検</text>
        <text x="0" y="78" fill="#88919d">焼き込み検証</text>
      </g>
    </g>

    <text x="1046" y="111" fill="#69727e" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16">RECOVERABLE · AUDITABLE · LOCAL-FIRST</text>
  </g>
</svg>
