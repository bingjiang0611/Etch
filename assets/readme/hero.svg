<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Etch — 从英文视频到双语成片，再到 B站投稿</title>
  <desc id="desc">Etch 把视频 URL 转换成可校对的双语硬字幕成片；当前主分支还可选择由本机直连 B站投稿。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161d"/>
      <stop offset="0.58" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#438cf5"/>
      <stop offset="1" stop-color="#7fb2ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="29" fill="none" stroke="#2b333d" stroke-width="2"/>

  <g transform="translate(62 52)">
    <text x="0" y="0" fill="#7fb2ff"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="650" letter-spacing="2">LOCAL BILINGUAL VIDEO WORKSTATION</text>
    <text x="0" y="86" fill="#f2f4f7"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="82" font-weight="720" letter-spacing="-3">Etch</text>
    <text x="0" y="135" fill="#c5cad1"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="29" font-weight="520">英文视频 → 可校对双语成片 → 可选 B站投稿</text>
    <text x="0" y="180" fill="#7f8996"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18">APPLE SILICON  ·  macOS 13.5+  ·  MAIN</text>
  </g>

  <g transform="translate(1002 54)">
    <rect width="126" height="126" rx="30" fill="#101721" stroke="#344154" stroke-width="2"/>
    <rect x="31" y="30" width="19" height="67" rx="9.5" fill="url(#accent)"/>
    <rect x="31" y="30" width="66" height="19" rx="9.5" fill="#e8f0ff"/>
    <rect x="31" y="54" width="47" height="19" rx="9.5" fill="#6ba6ff"/>
    <rect x="31" y="78" width="66" height="19" rx="9.5" fill="#315f9f"/>
  </g>

  <g transform="translate(62 272)">
    <path d="M24 31 H632" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M632 31 H1038" fill="none" stroke="#6cc79a" stroke-width="4" stroke-dasharray="9 9"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">
      <g transform="translate(24 0)">
        <circle cx="0" cy="31" r="15" fill="#0f1b2a" stroke="#7fb2ff" stroke-width="3"/>
        <text x="0" y="38" fill="#9fc4ff" font-size="15" font-weight="700">URL</text>
        <text x="0" y="82" fill="#c5cad1">视频链接</text>
      </g>
      <g transform="translate(328 0)">
        <circle cx="0" cy="31" r="15" fill="#0f1b2a" stroke="#7fb2ff" stroke-width="3"/>
        <text x="0" y="38" fill="#9fc4ff" font-size="18" font-weight="700">译</text>
        <text x="0" y="82" fill="#c5cad1">翻译与审校</text>
      </g>
      <g transform="translate(632 0)">
        <circle cx="0" cy="31" r="15" fill="#0f1b2a" stroke="#7fb2ff" stroke-width="3"/>
        <text x="0" y="38" fill="#9fc4ff" font-size="18" font-weight="700">片</text>
        <text x="0" y="82" fill="#c5cad1">验证成片</text>
      </g>
      <g transform="translate(1038 0)">
        <text x="0" y="-5" fill="#6cc79a" font-size="16" letter-spacing="1">MAIN · OPTIONAL</text>
        <circle cx="0" cy="31" r="15" fill="#101c16" stroke="#6cc79a" stroke-width="3"/>
        <text x="0" y="38" fill="#8ee0b5" font-size="18" font-weight="700">投</text>
        <text x="0" y="82" fill="#b8dcc8">B站投稿</text>
      </g>
    </g>

    <text x="1038" y="121" fill="#69727e" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16">REVIEWABLE · RECOVERABLE · LOCAL-FIRST</text>
  </g>
</svg>
