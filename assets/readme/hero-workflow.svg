<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Etch — 本地视频与网页内容工作站</title>
  <desc id="desc">Etch 把公开视频与网页变成可审阅、可恢复、可交付的双语硬字幕、带证据长文和离线文档。</desc>

  <rect width="1200" height="420" rx="24" fill="#0B0D10"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#252B33" stroke-width="2"/>

  <g id="title-block" transform="translate(56 54)">
    <text x="0" y="0" fill="#6BA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="18" font-weight="700" letter-spacing="2">LOCAL CONTENT WORKSTATION</text>
    <text x="0" y="92" fill="#F2F4F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="88" font-weight="760" letter-spacing="-3">Etch</text>
    <text x="0" y="148" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="35" font-weight="650">把公开视频与网页，变成</text>
    <text x="0" y="194" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="35" font-weight="650">可审阅、可恢复、可交付的中文成果。</text>
    <text x="0" y="248" fill="#88919D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21">为需要长期处理英文内容的创作者与研究者而做</text>
  </g>

  <g id="output-proof" transform="translate(718 44)">
    <text x="0" y="12" fill="#88919D" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="18" font-weight="650" letter-spacing="1.4">THREE DELIVERY FORMATS</text>

    <g transform="translate(0 38)">
      <rect width="426" height="82" rx="10" fill="#111419" stroke="#343C46"/>
      <text x="20" y="31" fill="#6BA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="18" font-weight="700">01  双语硬字幕</text>
      <text x="20" y="59" fill="#C5CAD1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">bilingual.srt  +  final.mp4</text>
      <circle cx="391" cy="41" r="13" fill="#101C16" stroke="#3E6C55"/>
      <path d="M385 41l4 4 8-10" fill="none" stroke="#6CC79A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(0 132)">
      <rect width="426" height="82" rx="10" fill="#111419" stroke="#343C46"/>
      <text x="20" y="31" fill="#6BA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="18" font-weight="700">02  带证据长文</text>
      <text x="20" y="59" fill="#C5CAD1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">summary.md  +  images/ (optional)</text>
      <rect x="376" y="28" width="30" height="26" rx="6" fill="#0F1B2A" stroke="#365F8F"/>
      <text x="391" y="47" fill="#7FB2FF" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="750">ABC</text>
    </g>

    <g transform="translate(0 226)">
      <rect width="426" height="82" rx="10" fill="#111419" stroke="#343C46"/>
      <text x="20" y="31" fill="#6BA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="18" font-weight="700">03  离线文档</text>
      <text x="20" y="59" fill="#C5CAD1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">translation.md + translation.html</text>
    </g>
  </g>

  <g id="recovery-rail" transform="translate(56 366)">
    <circle cx="8" cy="18" r="8" fill="#438CF5"/>
    <path d="M20 18H1074" stroke="#365F8F" stroke-width="2"/>
    <circle cx="1074" cy="18" r="8" fill="#6CC79A"/>
    <text x="30" y="7" fill="#88919D" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="18">task.json  →  checkpoint  →  verified artifact</text>
    <text x="1054" y="7" fill="#6CC79A" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="18" font-weight="700">COMMITTED</text>
  </g>
</svg>
