appId: com.baobingjiang.etch
productName: Etch
artifactName: "${productName}-${version}-${arch}.${ext}"
files:
  - out/**
  - package.json
  - node_modules/**
extraResources:
  - from: build/icon.png
    to: icon.png
mac:
  icon: build/icon.icns
  category: public.app-category.video
  identity: '-'
  signIgnore:
    - '\.(pak|dat)$'
  target:
    - target: dir
      arch:
        - arm64
  minimumSystemVersion: 13.5.0
